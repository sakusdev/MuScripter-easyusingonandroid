name: Exporter ABI CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exporter-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-export.txt

      - name: Install ExecuTorch exporter dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r tools/requirements-export.txt

      - name: Export and execute tiny stateful decoder
        env:
          PYTHONPATH: tools
        run: python tools/test_exporter_runtime.py

      - name: Export and execute dynamic prefill decoder
        env:
          PYTHONPATH: tools
        run: python tools/test_dynamic_prefill_runtime.py
